name: PostgreSQL integration

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: postgres-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://handrail_test:handrail_test@127.0.0.1:5432/handrail_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: handrail_test
          POSTGRES_USER: handrail_test
          POSTGRES_PASSWORD: handrail_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U handrail_test -d handrail_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Confirm PostgreSQL is ready
        run: pg_isready --dbname "$TEST_DATABASE_URL"
      - name: Install dependencies
        run: npm ci
      - name: Run PostgreSQL integration tests
        run: npm run test:postgres
