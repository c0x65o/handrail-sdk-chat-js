name: Node typecheck

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: node-typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Check committed package versions
        # Run before npm ci/prepare can regenerate checked-out source.
        run: node scripts/generate-package-version.mjs --check
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
